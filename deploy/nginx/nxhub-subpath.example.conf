# Example: serve NX Hub at https://example.com/nxhub/ behind nginx (server{} context).
# Pair with NX Hub settings (systemd drop-in or appsettings):
#   NxHub__PathBase=/nxhub
#   NxHub__Auth__TrustedProxyUserHeader=X-Remote-User   # only if nginx authenticates users itself
#
# Without a trusted header, NX Hub's own bearer token (web UI token prompt) still protects the API.
# Never expose NX Hub to the internet without authentication in front of it or in it.

location = /nxhub { return 308 /nxhub/$is_args$args; }

# Live events (WebSocket)
location = /nxhub/api/events {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 1h;
    # If nginx authenticates users, overwrite the identity header on every request:
    # proxy_set_header X-Remote-User $remote_user;
}

location ^~ /nxhub/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8080;      # path kept; NX Hub strips /nxhub via PathBase
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # proxy_set_header X-Remote-User $remote_user;
}
