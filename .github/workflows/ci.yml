name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  dotnet:
    name: .NET build, format and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore NxHub.slnx
      - run: dotnet build NxHub.slnx --no-restore -c Release
      - run: dotnet format NxHub.slnx --no-restore --verify-no-changes
      - run: dotnet test NxHub.slnx --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  web:
    name: Web UI typecheck and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run build

  publish:
    name: Publish ${{ matrix.rid }}
    needs: [dotnet, web]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-arm64, os: ubuntu-24.04 }
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: osx-arm64, os: macos-14 }
          - { rid: win-x64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet publish src/NxHub.Server -c Release -r ${{ matrix.rid }} --self-contained true -o publish/${{ matrix.rid }}
      # Build check only: no release artefacts are published from CI during milestone 1.

  arm64-smoke:
    name: Debian Bookworm arm64 smoke test
    needs: [dotnet, web]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Package
        run: scripts/package.sh linux-arm64
      - name: Run in debian:bookworm (arm64)
        run: |
          docker run --rm -v "$PWD/artifacts:/release:ro" debian:bookworm-slim bash -euc '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends libssl3 curl >/dev/null
            tar -xzf /release/nxhub-*-linux-arm64.tar.gz -C /tmp
            cd / && NxHub__DataDirectory=/tmp/data /tmp/nxhub-*-linux-arm64/app/nxhub &
            for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/api/health && break; sleep 0.5; done
            curl -fs http://127.0.0.1:8080/api/health
            test "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/switches)" = 401
            curl -fs http://127.0.0.1:8080/ | grep -q "<title>NX Hub"
          '
